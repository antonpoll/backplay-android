org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Путь проекта содержит кириллицу (папка на Google Диске) — отключаем проверку AGP.
android.overridePathCheck=true
# Обход бага D8 (NullPointerException) при дексинге org.mozilla:rhino:1.8.1 (транзитивная
# зависимость NewPipeExtractor) на AGP 7.3.1 — известный workaround для этого класса багов.
android.enableDexingArtifactTransform=false
