<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        #tag { position: absolute; top: 4px; left: 4px; color: #0ff; font: 11px monospace; z-index: 10; }
    </style>
</head>
<body>
<div id="tag">BOTTOM: Sintel</div>
<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    var VIDEO_ID = "eRsGyueVLvQ";
    var LABEL = "BOTTOM";
    var player;

    function log(msg) {
        console.log(LABEL + ": " + msg);
    }

    function onYouTubeIframeAPIReady() {
        log("API ready, creating player");
        player = new YT.Player('player', {
            width: '100%',
            height: '100%',
            videoId: VIDEO_ID,
            playerVars: {
                autoplay: 1,
                mute: 0,
                playsinline: 1,
                controls: 1,
                rel: 0
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange,
                'onError': onPlayerError
            }
        });
    }

    function onPlayerReady(event) {
        log("ready, unMute + play");
        player.unMute();
        player.setVolume(100);
        player.playVideo();
    }

    function onPlayerStateChange(event) {
        var names = {"-1": "UNSTARTED", "0": "ENDED", "1": "PLAYING", "2": "PAUSED", "3": "BUFFERING", "5": "CUED"};
        log("state=" + names[event.data] + " muted=" + player.isMuted() + " vol=" + player.getVolume());
        if (event.data === 0) {
            player.seekTo(0);
            player.playVideo();
        }
    }

    function onPlayerError(event) {
        log("ERROR code=" + event.data);
    }
</script>
</body>
</html>
